<!-- TITLE -->
<text x="900" y="790" text-anchor="middle" class="t">122. Best Time to Buy and Sell Stock II</text>

<!-- code block, matching screenshot content -->
<g transform="translate(465,825)">
  <text y="0" class="code">class Solution {</text>
  <text y="25" class="code">  public int maxProfit(int[] prices) {</text>
  <text y="50" class="code">    int maxProfit = 0;</text>
  <text y="75" class="code">    // T: O(n)</text>
  <text y="100" class="code">    // S: O(1)</text>
  <text y="125" class="code">    // [7,1,5,3,6,4]</text>
  <text y="150" class="code">    for (int i = 1; i &lt; prices.length; i++) {</text>
  <text y="175" class="code">      if (prices[i] &gt; prices[i - 1]) {</text>
  <text y="200" class="code">        maxProfit += prices[i] - prices[i - 1];</text>
  <text y="225" class="code">      }</text>
  <text y="250" class="code">    }</text>
  <text y="275" class="code">    return maxProfit;</text>
  <text y="300" class="code">  }</text>
  <text y="325" class="code">}</text>
</g>
</svg>