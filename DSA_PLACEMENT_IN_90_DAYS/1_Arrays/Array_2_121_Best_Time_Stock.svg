<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title { font-size: 40px; font-weight: bold; fill: #e03131; font-family: Arial, sans-serif; }
      .code-text { font-size: 18px; font-family: 'Courier New', monospace; fill: #333; font-weight: 500; }
      .code-comment { font-size: 16px; font-family: 'Courier New', monospace; fill: #888; font-style: italic; }
      .label { font-size: 16px; font-family: Arial, sans-serif; fill: #333; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="800" fill="#f9fafc"/>

  <!-- Title -->
  <text x="50" y="60" class="title">121. Best Time to Buy and Sell Stock</text>

  <!-- Code Section Background -->
  <rect x="40" y="90" width="820" height="680" fill="white" stroke="#ddd" stroke-width="2" rx="8"/>

  <!-- Code -->
  <text x="70" y="130" class="label" font-weight="bold">class Solution {</text>
  
  <text x="90" y="165" class="code-text">public int maxProfit(int[] prices) {</text>
  
  <text x="110" y="200" class="code-text">int minPrice = Integer.MAX_VALUE;</text>
  <text x="110" y="235" class="code-text">int maxProfit = 0;</text>
  
  <text x="110" y="275" class="code-text">for (int i = 0; i &lt; prices.length; i++) {</text>
  
  <text x="130" y="310" class="code-text">if (prices[i] &lt; minPrice) {</text>
  <text x="150" y="345" class="code-text">minPrice = prices[i];</text>
  <text x="130" y="380" class="code-text">} else {</text>
  <text x="150" y="415" class="code-text">int profit = prices[i] - minPrice;</text>
  <text x="150" y="450" class="code-text">maxProfit = Math.max(maxProfit, profit);</text>
  <text x="130" y="485" class="code-text">}</text>
  
  <text x="110" y="520" class="code-text">}</text>
  
  <text x="110" y="560" class="code-text">return maxProfit;</text>
  
  <text x="70" y="600" class="label" font-weight="bold">}</text>

  <text x="70" y="640" class="label" font-weight="bold">}</text>
</svg>